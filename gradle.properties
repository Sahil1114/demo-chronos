# ── JVM ──────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC

# ── Build performance ─────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true

 org.gradle.configuration-cache=true

# ── KSP2 ─────────────────────────────────────────────────────
# KSP2 is the default since Kotlin 2.3.0 — kept explicit for clarity
ksp.useKSP2=true

# ── Kotlin Multiplatform ──────────────────────────────────────
kotlin.mpp.stability.nowarn=true
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

kotlin.native.ignoreDisabledTargets=true

# ── Android ───────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
kotlin.mpp.applyDefaultHierarchyTemplate=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
