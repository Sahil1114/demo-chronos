[versions]
# ── Build chain ──────────────────────────────────────────────
kotlin = "2.4.20"
agp = "9.4.1"
ksp = "2.3.12"           # KSP2 — standalone versioning since Kotlin 2.3.0+

# ── Core runtime ─────────────────────────────────────────────
coroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.11.0"

# ── Room 3.0 KMP ─────────────────────────────────────────────
room = "3.0.3"
sqlite = "2.7.1"

# ── Android ──────────────────────────────────────────────────
workmanager = "2.12.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.10.2"

# ── KSP Processor ────────────────────────────────────────────
kotlinpoet = "2.4.0"

# ── Sample App ───────────────────────────────────────────────
composeMultiplatform = "1.12.1"

# ── Testing ──────────────────────────────────────────────────
coroutinesTest = "1.11.0"
androidxTest = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestJunit = "1.2.1"

# ── Publishing ───────────────────────────────────────────────
mavenPublish = "0.37.0"
bcv = "0.17.0"

# ── Compile targets ──────────────────────────────────────────
compileSdk = "37"
minSdk = "24"
targetSdk = "35"

[libraries]
# ── Core runtime ─────────────────────────────────────────────
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ── Room 3.0 ─────────────────────────────────────────────────
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# ── Android WorkManager ───────────────────────────────────────
workmanager-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workmanager" }
workmanager-testing = { module = "androidx.work:work-testing", version.ref = "workmanager" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

# ── KSP Processor module ──────────────────────────────────────
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlinpoet-ksp = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }

# ── Sample app ────────────────────────────────────────────────
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }

[plugins]
# ── Kotlin ───────────────────────────────────────────────────
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinPluginCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# ── Android ──────────────────────────────────────────────────
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }

# ── KSP ──────────────────────────────────────────────────────
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# ── Room ─────────────────────────────────────────────────────
room = { id = "androidx.room3", version.ref = "room" }

# ── Compose Multiplatform ────────────────────────────────────
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }

# ── Publishing ───────────────────────────────────────────────
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
